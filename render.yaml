services:
  - type: web
    name: salesiq-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false        # set manually in Render dashboard — never commit this
      - key: JWT_SECRET
        sync: false        # set manually in Render dashboard
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false        # set manually in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: CORS_ORIGINS
        sync: false        # set to your Vercel/Netlify URL after frontend deploy
      - key: LOG_LEVEL
        value: INFO
